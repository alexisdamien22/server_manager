name: Manager Tests

on:
  push:
    branches: [main]
    paths:
      - 'java-manager/**'
      - '.github/workflows/manager.yml'

  pull_request:
    branches: [main]
    paths:
      - 'java-manager/**'
      - '.github/workflows/manager.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-manager

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn -B clean package

      - name: Start Manager
        run: |
          mvn exec:java \
            -Dexec.mainClass=com.alexisdamien22.servermanager.Main \
            > /tmp/manager.log 2>&1 &

      - name: Wait For Manager
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:9000/health; then
              exit 0
            fi
            sleep 1
          done
      
      - name: Verify Applications Endpoint
        run: |
          RESPONSE=$(curl -s \
            http://127.0.0.1:9000/applications)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep "console-test"
      
      - name: Verify Start Endpoint
        run: |
          curl -X POST \
            "http://127.0.0.1:9000/applications/start?id=console-test"

      - name: Verify Application Running
        run: |
          curl -s \
            http://127.0.0.1:9000/applications/status?id=console-test" \
            | grep '"running":true'

      - name: Stop Application
        run: |
          curl -X POST \
            "http://127.0.0.1:9000/applications/stop?id=console-test"

      - name: Verify Stopped
        run: |
          curl -s \
            "http://127.0.0.1:9000/applications/status?id=console-test" \
            | grep '"running":false'

      - name: Verify Console Output
        run: |
            for i in {1..10}; do

            if grep -q "HELLO_MANAGER" /tmp/manager.log
            then
                echo "Console reader works"
                exit 0
            fi

            sleep 1
            done

            echo "Console output not found"
            cat /tmp/manager.log
            exit 1